<!doctype html>
<html
  lang="fr"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"ground","type":"color","label":"Fond clair","default":"#f4f0e8"},
    {"id":"ink","type":"color","label":"Encre","default":"#121210"},
    {"id":"accent","type":"color","label":"Accent","default":"#d8fb54"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f4f0e8;
        --ink: #121210;
        --accent: #d8fb54;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="24.6"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg"></div>

      <div id="ticket" data-composition-id="ticket" data-composition-src="compositions/ticket.html"
        data-start="0" data-duration="4.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="question" data-composition-id="question" data-composition-src="compositions/question.html"
        data-start="4.2" data-duration="3.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="steps" data-composition-id="steps" data-composition-src="compositions/steps.html"
        data-start="7.6" data-duration="3.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="gallery" data-composition-id="gallery" data-composition-src="compositions/gallery.html"
        data-start="11.2" data-duration="6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="claim" data-composition-id="claim" data-composition-src="compositions/claim.html"
        data-start="17.2" data-duration="3.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="20.6" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <!-- Sound effects (bundled HyperFrames library); each lands one frame after its picture -->
      <audio id="sfx-stamp" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0.83" data-duration="2.1" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-tick1" class="clip" src="assets/sfx/key-press.mp3" data-start="1.83" data-duration="0.4" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-tick2" class="clip" src="assets/sfx/key-press.mp3" data-start="2.23" data-duration="0.4" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-tick3" class="clip" src="assets/sfx/key-press.mp3" data-start="2.63" data-duration="0.4" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-tick4" class="clip" src="assets/sfx/key-press.mp3" data-start="3.03" data-duration="0.4" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-whip1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.8" data-duration="0.57" data-track-index="13" data-volume="0.45"></audio>
      <audio id="sfx-whip2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="8.8" data-duration="0.57" data-track-index="13" data-volume="0.3"></audio>
      <audio id="sfx-whip3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="10.0" data-duration="0.57" data-track-index="13" data-volume="0.3"></audio>
      <audio id="sfx-wheel" class="clip" src="assets/sfx/whoosh.mp3" data-start="10.85" data-duration="0.57" data-track-index="14" data-volume="0.45"></audio>
      <audio id="sfx-ready1" class="clip" src="assets/sfx/pop.mp3" data-start="11.58" data-duration="0.7" data-track-index="15" data-volume="0.45"></audio>
      <audio id="sfx-ready2" class="clip" src="assets/sfx/click-soft.mp3" data-start="12.78" data-duration="0.37" data-track-index="16" data-volume="0.6"></audio>
      <audio id="sfx-ready3" class="clip" src="assets/sfx/pop.mp3" data-start="13.98" data-duration="0.7" data-track-index="15" data-volume="0.45"></audio>
      <audio id="sfx-ready4" class="clip" src="assets/sfx/click-soft.mp3" data-start="15.18" data-duration="0.37" data-track-index="16" data-volume="0.6"></audio>
      <audio id="sfx-ready5" class="clip" src="assets/sfx/pop.mp3" data-start="16.38" data-duration="0.7" data-track-index="15" data-volume="0.45"></audio>
      <audio id="sfx-mark" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="19.25" data-duration="2.59" data-track-index="17" data-volume="0.35"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
