<template>
  <style>
    @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }
    @font-face { font-family: "Manrope"; font-weight: 800; src: url("assets/fonts/manrope-latin-800-normal.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; overflow: hidden; background: #121210; }
    #st-flood { position: absolute; inset: 0; background: #d8fb54; }
    .st-verb { position: absolute; left: 96px; right: 96px; top: 470px; color: #121210;
      font: 700 172px/0.96 "Space Grotesk", sans-serif; letter-spacing: -0.06em; }
    .st-sub { display: block; margin-top: 34px; font: 800 44px/1.25 Manrope, sans-serif; letter-spacing: 0; color: #3b4a10; }
    #st-wheel { position: absolute; left: 360px; top: 880px; width: 360px; height: 360px; }
    #st-wheel svg { width: 100%; height: 100%; overflow: visible; }
  </style>
  <div id="root" data-composition-id="steps" data-width="1080" data-height="1920">
    <div id="st-flood"></div>
    <div id="st-v1" class="st-verb">Réservez.</div>
    <div id="st-v2" class="st-verb">On débarque.</div>
    <div id="st-v3" class="st-verb">Vous roulez.</div>
    <div id="st-wheel" data-layout-allow-overflow data-layout-ignore>
      <svg viewBox="-100 -100 200 200" aria-hidden="true">
        <circle id="st-disk" r="96" fill="#121210" opacity="0" />
        <g id="st-spin" stroke="#121210" fill="none">
          <circle r="92" stroke-width="10" />
          <circle r="80" stroke-width="3" />
          <circle r="9" fill="#121210" stroke="none" />
          <g stroke-width="2.2">
            <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(0)" />
            <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(22.5)" />
            <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(45)" />
            <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(67.5)" />
            <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(90)" />
            <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(112.5)" />
            <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(135)" />
            <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(157.5)" />
            <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(180)" />
            <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(202.5)" />
            <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(225)" />
            <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(247.5)" />
            <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(270)" />
            <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(292.5)" />
            <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(315)" />
            <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(337.5)" />
          </g>
        </g>
      </svg>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // Lime floods over the ink from the bottom
    tl.fromTo("#st-flood", { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: 0.4, ease: "power2.inOut" }, 0);
    // Three verbs on one stage: vertical whip between them
    const verbs = ["#st-v1", "#st-v2", "#st-v3"];
    const ins = [0.3, 1.25, 2.45];
    verbs.forEach((v, i) => {
      tl.fromTo(v, { opacity: 0, y: 90, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: "expo.out" }, ins[i]);
      const out = i < 2 ? ins[i + 1] - 0.14 : 3.12;
      tl.fromTo(v, { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -90, filter: "blur(14px)", duration: 0.14, ease: "power3.in", immediateRender: false }, out);
    });
    // The wheel rolls in from the left and stops under the copy
    tl.fromTo("#st-wheel", { x: -760 }, { x: 0, duration: 2.6, ease: "power2.out" }, 0.25);
    tl.fromTo("#st-spin", { rotation: -235, transformOrigin: "50% 50%" }, { rotation: 0, duration: 2.6, ease: "power2.out" }, 0.25);
    // ...then becomes the next world: it fills with ink and grows past the frame
    tl.fromTo("#st-disk", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 3.0);
    tl.fromTo("#st-wheel", { scale: 1 }, { scale: 11, duration: 0.42, ease: "power3.in" }, 3.12);
    window.__timelines["steps"] = tl;
  </script>
</template>
