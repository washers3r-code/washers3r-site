<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="theme-color" content="#121210" />
<title>Admin — Washers3R</title>
<style>
  :root { --gold:#d4a653; --dark:#121210; --bg:#f4f0e8; --muted:#736a5d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { font-family:-apple-system,'Helvetica Neue',Arial,sans-serif; background:var(--bg) url('assets/w3r-logo-marble.jpg') center top/cover no-repeat; background-attachment:scroll; background-blend-mode:soft-light; color:var(--dark); -webkit-font-smoothing:antialiased; }

  .gate { min-height:100dvh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; padding:24px; background:#121210 url('assets/w3r-logo-marble.jpg') center/cover; background-blend-mode:soft-light; color:#fff; text-align:center; }
  .gate .logo-dot { width:44px; height:44px; border-radius:50%; background:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--dark); font-size:18px; margin-bottom:6px; }
  .gate h1 { font-size:18px; margin:0; font-weight:600; }
  .gate p { font-size:13px; color:#aaa; margin:0 0 10px; }
  .gate form { display:flex; flex-direction:column; gap:16px; align-items:center; }
  .gate input { font-size:18px; padding:14px 16px; border:1px solid #333; border-radius:12px; width:min(280px,80vw); text-align:center; letter-spacing:3px; background:#1c1c1a; color:#fff; }
  .gate input:focus { outline:2px solid var(--gold); }
  .gate button { font-size:15px; padding:14px 26px; border:none; border-radius:12px; background:var(--gold); color:var(--dark); cursor:pointer; font-weight:700; width:min(280px,80vw); }
  .gate button:active { transform:scale(.97); }
  .gate button:disabled { opacity:.6; }
  .gate .error { color:#ff8a7a; font-size:13px; min-height:16px; }
  .hidden { display:none !important; }

  header.admin-top { position:sticky; top:0; z-index:10; background:var(--dark); color:#fff; padding:14px 16px; padding-top:max(14px, env(safe-area-inset-top)); }
  .admin-top-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .admin-top h1 { font-size:15px; margin:0; font-weight:700; letter-spacing:.2px; }
  .admin-top .sub { font-size:11px; color:#9a9a92; margin-top:2px; }
  .icon-btn { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); color:#fff; width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; flex:none; }
  .icon-btn:active { background:rgba(255,255,255,.2); }
  .toolbar { display:flex; gap:8px; margin-bottom:10px; }
  .toolbar input[type="search"] { flex:1; font-size:15px; padding:10px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.08); color:#fff; }
  .toolbar input[type="search"]::placeholder { color:#8a8a82; }

  .tabbar { display:flex; gap:6px; background:rgba(255,255,255,.06); border-radius:10px; padding:4px; }
  .tabbar button { flex:1; border:none; background:transparent; color:#bbb; font-size:13px; font-weight:600; padding:8px 10px; border-radius:8px; cursor:pointer; }
  .tabbar button.active { background:var(--gold); color:var(--dark); }

  main { padding:16px 14px 60px; max-width:640px; margin:0 auto; }

  .section { margin-bottom:24px; }
  .section-head { display:flex; align-items:center; gap:8px; margin:0 4px 10px; }
  .section-head h2 { font-size:13px; text-transform:uppercase; letter-spacing:.5px; margin:0; color:var(--muted); font-weight:700; }
  .section-count { font-size:11px; background:#e9e2d3; color:var(--muted); padding:2px 8px; border-radius:10px; font-weight:700; }

  .list { background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.05); border:1px solid #ece6d8; }
  .row { display:flex; align-items:center; gap:12px; padding:13px 16px; cursor:pointer; border-bottom:1px solid #f1ece0; }
  .row:last-child { border-bottom:none; }
  .row:active { background:#f7f4ec; }
  .row-avatar { width:36px; height:36px; border-radius:50%; background:#f1e6cf; color:#8a642a; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none; }
  .row-avatar.entreprise { background:#e4ecfb; color:#1c4e8c; }
  .row-main { flex:1; min-width:0; }
  .row-name { font-size:14.5px; font-weight:700; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-sub { font-size:12px; color:#8b8378; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-chevron { color:#c9c0ac; font-size:16px; flex:none; }
  .row-count { font-size:11px; background:#f1e6cf; color:#8a642a; padding:3px 9px; border-radius:20px; font-weight:700; flex:none; }

  .empty { text-align:center; padding:60px 20px; color:#999; font-size:14px; }
  .empty .big { font-size:32px; display:block; margin-bottom:10px; }

  /* Detail overlay */
  .overlay { position:fixed; inset:0; background:var(--bg); z-index:50; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .28s ease; }
  .overlay.show { transform:translateX(0); }
  .overlay-top { background:var(--dark); color:#fff; padding:14px 16px; padding-top:max(14px, env(safe-area-inset-top)); display:flex; align-items:center; gap:12px; }
  .overlay-back { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); color:#fff; width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; flex:none; }
  .overlay-top h2 { font-size:15px; margin:0; font-weight:700; }
  .overlay-body { flex:1; overflow-y:auto; padding:18px 16px 60px; -webkit-overflow-scrolling:touch; }

  .detail-hero { background:#fff; border-radius:14px; padding:18px; margin-bottom:14px; border:1px solid #ece6d8; }
  .detail-hero .name { font-size:19px; font-weight:800; margin:0 0 4px; }
  .detail-hero .received { font-size:12px; color:#9a9a92; }
  .tag { display:inline-block; font-size:10.5px; padding:4px 10px; border-radius:20px; font-weight:700; letter-spacing:.2px; white-space:nowrap; margin-top:10px; }
  .tag-reservation { background:#f1e6cf; color:#8a642a; }
  .tag-entreprise { background:#dbe8fb; color:#1c4e8c; }

  .detail-actions { display:flex; gap:8px; margin-top:16px; }
  .pill-btn { flex:1; text-align:center; font-size:13px; padding:11px 10px; border-radius:10px; border:1px solid #ddd; background:#fafaf8; color:#333; cursor:pointer; text-decoration:none; font-weight:600; }
  .pill-btn:active { background:#f0f0ea; }
  .pill-btn.primary { background:var(--dark); color:#fff; border-color:var(--dark); }
  .pill-btn.danger { background:#fdecea; color:#c0392b; border-color:#f6c9c3; }

  .detail-fields { background:#fff; border-radius:14px; border:1px solid #ece6d8; overflow:hidden; margin-bottom:14px; }
  .detail-field { padding:12px 16px; border-bottom:1px solid #f1ece0; }
  .detail-field:last-child { border-bottom:none; }
  .detail-field b { display:block; color:#9a9a92; font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; margin-bottom:3px; }
  .detail-field span { font-size:14.5px; color:#222; white-space:pre-wrap; word-break:break-word; }

  .history-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; border-bottom:1px solid #f1ece0; }
  .history-row:last-child { border-bottom:none; }
  .history-main { flex:1; min-width:0; }
  .history-plan { font-size:13.5px; font-weight:600; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .history-date { font-size:11.5px; color:#9a9a92; margin-top:1px; }
  .trash-btn { background:none; border:none; color:#c0392b; font-size:16px; cursor:pointer; padding:6px; flex:none; }

  .field-card { background:#fff; border-radius:14px; border:1px solid #ece6d8; padding:14px 16px; margin-bottom:12px; }
  .field-card h3 { font-size:14px; margin:0 0 10px; }
  .field-row { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
  .field-row:last-child { margin-bottom:0; }
  .field-row label { font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:#9a9a92; font-weight:700; }
  .field-row input[type="text"] { font-size:14.5px; padding:10px 12px; border-radius:9px; border:1px solid #ddd; background:#fafaf8; }
  .save-bar { position:sticky; bottom:0; padding:12px 0 4px; background:linear-gradient(to top, var(--bg) 70%, transparent); }
  .save-btn { width:100%; font-size:15px; padding:14px; border:none; border-radius:12px; background:var(--dark); color:#fff; font-weight:700; cursor:pointer; }
  .save-btn:disabled { opacity:.6; }
  .save-msg { text-align:center; font-size:12.5px; margin-top:8px; min-height:16px; }

  .photo-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
  .photo-item { position:relative; }
  .photo-frame { position:relative; border-radius:12px; overflow:hidden; aspect-ratio:4/3; background:#eee; cursor:grab; touch-action:none; }
  .photo-frame.dragging { cursor:grabbing; }
  .photo-frame img { width:100%; height:100%; object-fit:cover; display:block; user-select:none; -webkit-user-drag:none; }
  .photo-remove { position:absolute; top:6px; right:6px; background:rgba(0,0,0,.6); color:#fff; border:none; border-radius:8px; width:28px; height:28px; font-size:14px; cursor:pointer; z-index:2; }
  .photo-zoom { width:100%; margin-top:6px; accent-color:var(--dark); }
  .photo-hint { font-size:10.5px; color:#8a8272; text-align:center; margin-top:2px; }
  .upload-btn { display:block; width:100%; text-align:center; font-size:14px; padding:14px; border-radius:12px; border:1px dashed #c9c0ac; background:#fafaf8; color:var(--dark); font-weight:700; cursor:pointer; }
  .upload-btn input { display:none; }

  @media (min-width:600px) {
    main { max-width:760px; }
    .overlay { max-width:520px; left:auto; right:0; box-shadow:-4px 0 24px rgba(0,0,0,.15); }
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="logo-dot">W3R</div>
  <h1>Zone administrateur</h1>
  <p>Entre ton code d'acces pour voir les demandes</p>
  <form id="gateForm" autocomplete="off">
    <input type="text" inputmode="numeric" pattern="[0-9]*" autocapitalize="off" autocorrect="off" spellcheck="false" id="codeInput" placeholder="Code d'acces" autocomplete="one-time-code" />
    <button id="unlockBtn" type="submit">Deverrouiller</button>
  </form>
  <p class="error" id="gateError"></p>
</div>

<div id="adminApp" class="hidden">
  <header class="admin-top">
    <div class="admin-top-row">
      <div>
        <h1 id="pageTitle">Demandes recues</h1>
        <div class="sub" id="statusLine">Chargement...</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" id="refreshBtn" type="button" aria-label="Rafraichir">&#8635;</button>
        <button class="icon-btn" id="lockBtn" type="button" aria-label="Verrouiller">&#128274;</button>
      </div>
    </div>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Rechercher un nom, une entreprise..." />
    </div>
    <div class="tabbar">
      <button class="active" data-tab="demandes" type="button">Demandes</button>
      <button data-tab="clients" type="button">Clients</button>
      <button data-tab="contenu" type="button">Contenu</button>
      <button data-tab="photos" type="button">Photos</button>
    </div>
  </header>
  <main>
    <div id="sections"></div>
    <div id="clientsList" class="hidden"></div>
    <div id="contentTab" class="hidden"></div>
    <div id="photosTab" class="hidden"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-top">
    <button class="overlay-back" id="overlayBack" type="button" aria-label="Retour">&#8592;</button>
    <h2 id="overlayTitle">Details de la demande</h2>
  </div>
  <div class="overlay-body" id="overlayBody"></div>
</div>

<script>
window.addEventListener("error", function (e) {
  var el = document.getElementById("gateError");
  if (el) el.textContent = "Erreur: " + e.message;
});

(function () {
  var STORAGE_KEY = "w3r_admin_code";
  var gate = document.getElementById("gate");
  var gateError = document.getElementById("gateError");
  var codeInput = document.getElementById("codeInput");
  var unlockBtn = document.getElementById("unlockBtn");
  var adminApp = document.getElementById("adminApp");
  var statusLine = document.getElementById("statusLine");
  var pageTitle = document.getElementById("pageTitle");
  var sectionsEl = document.getElementById("sections");
  var clientsListEl = document.getElementById("clientsList");
  var contentTabEl = document.getElementById("contentTab");
  var photosTabEl = document.getElementById("photosTab");
  var refreshBtn = document.getElementById("refreshBtn");
  var lockBtn = document.getElementById("lockBtn");
  var searchInput = document.getElementById("search");
  var overlay = document.getElementById("overlay");
  var overlayBody = document.getElementById("overlayBody");
  var overlayTitle = document.getElementById("overlayTitle");
  var overlayBack = document.getElementById("overlayBack");
  var tabButtons = document.querySelectorAll(".tabbar button");

  var allSubmissions = [];
  var activeTab = "demandes";

  var FIELD_LABELS = {
    company: "Entreprise",
    name: "Nom",
    email: "Courriel",
    phone: "Telephone",
    address: "Adresse",
    plan: "Forfait",
    date: "Date souhaitee",
    note: "Details / notes",
    "bike-count": "Nombre de velos",
    "custom-desc": "Description personnalisee"
  };

  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleString("fr-CA", { dateStyle: "medium", timeStyle: "short" });
    } catch (e) {
      return iso;
    }
  }

  function formatRequestedDate(value) {
    if (!value) return "-";
    try {
      return new Date(value + "T00:00:00").toLocaleDateString("fr-CA", { dateStyle: "medium" });
    } catch (e) {
      return value;
    }
  }

  function shortenPlan(plan) {
    if (!plan) return plan;
    var m = plan.match(/^MPV\s*\d+/i);
    if (m) return m[0].replace(/\s+/, " ");
    if (/^Personnalis/i.test(plan)) return "Personnalise";
    return plan;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      var map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
      return map[c];
    });
  }

  function initials(name) {
    var parts = String(name).trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "?";
    return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }

  function clientKeyFor(s) {
    var d = s.data || {};
    return (d.email || d.phone || d.name || d.company || "inconnu").toLowerCase().trim();
  }

  function getCode() {
    return sessionStorage.getItem(STORAGE_KEY);
  }

  function deleteSubmission(id) {
    var code = getCode();
    return fetch("/.netlify/functions/delete-submission", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-admin-code": code },
      body: JSON.stringify({ id: id })
    }).then(function (res) {
      if (!res.ok) throw new Error("delete-failed");
      allSubmissions = allSubmissions.filter(function (s) { return s.id !== id; });
    });
  }

  function openDetail(s) {
    var d = s.data || {};
    var name = d.name || d.company || "-";
    var requestedDate = formatRequestedDate(d.date);
    var phone = d.phone || "";
    var email = d.email || "";
    var tagClass = s.form === "entreprise" ? "tag-entreprise" : "tag-reservation";
    var tagLabel = s.form === "entreprise" ? "Entreprise" : "Reservation";

    var fieldsHtml = "";
    var skip = { "form-name": true, "submission-id": true, "bot-field": true, name: true, company: true };
    Object.keys(d).forEach(function (key) {
      if (skip[key]) return;
      var value = d[key];
      if (!value) return;
      var label = FIELD_LABELS[key] || key;
      var display = key === "date" ? requestedDate : (key === "plan" ? shortenPlan(value) : value);
      fieldsHtml += '<div class="detail-field"><b>' + escapeHtml(label) + "</b><span>" + escapeHtml(display) + "</span></div>";
    });

    overlayTitle.textContent = "Details de la demande";
    overlayBody.innerHTML =
      '<div class="detail-hero">' +
        '<p class="name">' + escapeHtml(name) + "</p>" +
        '<div class="received">Recu le ' + formatDate(s.created_at) + "</div>" +
        '<span class="tag ' + tagClass + '">' + tagLabel + "</span>" +
        '<div class="detail-actions">' +
          (phone ? '<a class="pill-btn primary" href="tel:' + escapeHtml(phone) + '">Appeler</a>' : "") +
          (email ? '<a class="pill-btn" href="mailto:' + escapeHtml(email) + '">Courriel</a>' : "") +
        "</div>" +
      "</div>" +
      '<div class="detail-fields">' + fieldsHtml + "</div>" +
      '<button class="pill-btn danger" id="deleteBtn" type="button" style="width:100%;">Supprimer cette demande</button>';

    document.getElementById("deleteBtn").addEventListener("click", function () {
      if (!confirm("Supprimer definitivement cette demande de " + name + " ? Cette action est irreversible.")) return;
      deleteSubmission(s.id)
        .then(function () {
          overlay.classList.remove("show");
          render();
        })
        .catch(function () { alert("Erreur lors de la suppression. Reessaie."); });
    });

    overlay.classList.add("show");
  }

  function openClientDetail(key, items) {
    var d0 = items[0].data || {};
    var name = d0.name || d0.company || "-";
    var phone = d0.phone || "";
    var email = d0.email || "";
    var sorted = items.slice().sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });

    var historyHtml = "";
    sorted.forEach(function (s) {
      var d = s.data || {};
      var plan = shortenPlan(d.plan) || (s.form === "entreprise" ? "Soumission entreprise" : "-");
      var reqDate = formatRequestedDate(d.date);
      historyHtml +=
        '<div class="history-row" data-id="' + s.id + '">' +
          '<div class="history-main"><p class="history-plan">' + escapeHtml(plan) + '</p><div class="history-date">' + escapeHtml(reqDate) + "</div></div>" +
          '<button class="trash-btn" data-id="' + s.id + '" aria-label="Supprimer">Suppr.</button>' +
        "</div>";
    });

    overlayTitle.textContent = "Fiche client";
    overlayBody.innerHTML =
      '<div class="detail-hero">' +
        '<p class="name">' + escapeHtml(name) + "</p>" +
        '<div class="received">' + items.length + " reservation(s) au total</div>" +
        '<div class="detail-actions">' +
          (phone ? '<a class="pill-btn primary" href="tel:' + escapeHtml(phone) + '">Appeler</a>' : "") +
          (email ? '<a class="pill-btn" href="mailto:' + escapeHtml(email) + '">Courriel</a>' : "") +
        "</div>" +
      "</div>" +
      '<div class="detail-fields">' + historyHtml + "</div>";

    var trashButtons = overlayBody.querySelectorAll(".trash-btn");
    trashButtons.forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = btn.getAttribute("data-id");
        if (!confirm("Supprimer cette demande de l'historique de " + name + " ?")) return;
        deleteSubmission(id)
          .then(function () {
            var remaining = allSubmissions.filter(function (s) { return clientKeyFor(s) === key; });
            if (remaining.length === 0) {
              overlay.classList.remove("show");
            } else {
              openClientDetail(key, remaining);
            }
            render();
          })
          .catch(function () { alert("Erreur lors de la suppression. Reessaie."); });
      });
    });

    overlay.classList.add("show");
  }

  overlayBack.addEventListener("click", function () { overlay.classList.remove("show"); });

  function renderDemandes(filtered) {
    sectionsEl.innerHTML = "";

    if (filtered.length === 0) {
      sectionsEl.innerHTML = '<div class="empty"><span class="big">-</span>Aucune demande trouvee.</div>';
      return;
    }

    var groups = [
      { key: "reservation", label: "Reservations" },
      { key: "entreprise", label: "Entreprises" }
    ];

    groups.forEach(function (group) {
      var items = filtered.filter(function (s) { return s.form === group.key; });
      if (items.length === 0) return;

      var section = document.createElement("div");
      section.className = "section";

      var head = document.createElement("div");
      head.className = "section-head";
      head.innerHTML = "<h2>" + group.label + '</h2><span class="section-count">' + items.length + "</span>";
      section.appendChild(head);

      var list = document.createElement("div");
      list.className = "list";

      items.forEach(function (s) {
        var d = s.data || {};
        var name = d.name || d.company || "-";
        var plan = shortenPlan(d.plan) || (s.form === "entreprise" ? (d["bike-count"] ? d["bike-count"] + " velo(s)" : "Soumission") : "");
        var reqDate = formatRequestedDate(d.date);
        var sub = plan + (d.date ? " . " + reqDate : "");

        var row = document.createElement("div");
        row.className = "row";
        row.innerHTML =
          '<div class="row-avatar' + (s.form === "entreprise" ? " entreprise" : "") + '">' + initials(name) + "</div>" +
          '<div class="row-main">' +
            '<p class="row-name">' + escapeHtml(name) + "</p>" +
            '<div class="row-sub">' + escapeHtml(sub) + "</div>" +
          "</div>" +
          '<span class="row-chevron">&#8250;</span>';

        row.addEventListener("click", function () { openDetail(s); });
        list.appendChild(row);
      });

      section.appendChild(list);
      sectionsEl.appendChild(section);
    });
  }

  function renderClients(filtered) {
    clientsListEl.innerHTML = "";

    if (filtered.length === 0) {
      clientsListEl.innerHTML = '<div class="empty"><span class="big">-</span>Aucun client trouve.</div>';
      return;
    }

    var map = {};
    var order = [];
    filtered.forEach(function (s) {
      var key = clientKeyFor(s);
      if (!map[key]) { map[key] = []; order.push(key); }
      map[key].push(s);
    });

    var clients = order.map(function (key) { return [key, map[key]]; });
    clients.sort(function (a, b) { return b[1].length - a[1].length; });

    var section = document.createElement("div");
    section.className = "section";
    var head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML = "<h2>Clients</h2><span class=\"section-count\">" + clients.length + "</span>";
    section.appendChild(head);

    var list = document.createElement("div");
    list.className = "list";

    clients.forEach(function (entry) {
      var key = entry[0];
      var items = entry[1];
      var d0 = items[0].data || {};
      var name = d0.name || d0.company || "-";
      var isCorp = items.some(function (s) { return s.form === "entreprise"; });

      var row = document.createElement("div");
      row.className = "row";
      row.innerHTML =
        '<div class="row-avatar' + (isCorp ? " entreprise" : "") + '">' + initials(name) + "</div>" +
        '<div class="row-main">' +
          '<p class="row-name">' + escapeHtml(name) + "</p>" +
          '<div class="row-sub">' + escapeHtml(d0.email || d0.phone || "") + "</div>" +
        "</div>" +
        '<span class="row-count">' + items.length + "</span>";

      row.addEventListener("click", function () { openClientDetail(key, items); });
      list.appendChild(row);
    });

    section.appendChild(list);
    clientsListEl.appendChild(section);
  }

  function render() {
    var q = searchInput.value.trim().toLowerCase();
    var filtered = allSubmissions.filter(function (s) {
      if (!q) return true;
      return JSON.stringify(s.data).toLowerCase().indexOf(q) !== -1;
    });

    if (activeTab === "demandes") {
      renderDemandes(filtered);
    } else {
      renderClients(filtered);
    }
  }

  var MPV_META = {
    1: "Mise au point essentielle",
    2: "Entretien transmission",
    3: "Inspection approfondie",
    4: "Entretien complet",
    5: "Remise a neuf"
  };
  var siteContent = null;

  function loadSiteContent() {
    return fetch("/.netlify/functions/get-content")
      .then(function (res) { return res.json(); })
      .then(function (data) { siteContent = data; return data; });
  }

  function renderContentTab() {
    if (!siteContent) {
      contentTabEl.innerHTML = '<div class="empty">Chargement...</div>';
      loadSiteContent().then(renderContentTab).catch(function () {
        contentTabEl.innerHTML = '<div class="empty">Erreur de chargement.</div>';
      });
      return;
    }
    var html = "";
    Object.keys(MPV_META).forEach(function (n) {
      var entry = (siteContent.mpv && siteContent.mpv["mpv" + n]) || { price: "", promo: "" };
      html +=
        '<div class="field-card">' +
          "<h3>MPV " + n + " — " + MPV_META[n] + "</h3>" +
          '<div class="field-row"><label>Prix</label><input type="text" data-mpv-field="price" data-mpv="' + n + '" value="' + escapeHtml(entry.price || "") + '" placeholder="ex: 35 $ sans taxes" /></div>' +
          '<div class="field-row"><label>Texte promo (optionnel, affiche sous le prix)</label><input type="text" data-mpv-field="promo" data-mpv="' + n + '" value="' + escapeHtml(entry.promo || "") + '" placeholder="ex: Rabais 10$ jusqu\'au 30 aout" /></div>' +
        "</div>";
    });
    html +=
      '<div class="save-bar">' +
        '<button class="save-btn" id="saveContentBtn" type="button">Enregistrer</button>' +
        '<div class="save-msg" id="saveContentMsg"></div>' +
      "</div>";
    contentTabEl.innerHTML = html;

    document.getElementById("saveContentBtn").addEventListener("click", function () {
      var mpv = {};
      Object.keys(MPV_META).forEach(function (n) {
        var priceInput = contentTabEl.querySelector('input[data-mpv-field="price"][data-mpv="' + n + '"]');
        var promoInput = contentTabEl.querySelector('input[data-mpv-field="promo"][data-mpv="' + n + '"]');
        mpv["mpv" + n] = { price: priceInput.value.trim(), promo: promoInput.value.trim() };
      });
      var btn = document.getElementById("saveContentBtn");
      var msg = document.getElementById("saveContentMsg");
      btn.disabled = true;
      msg.textContent = "Enregistrement...";
      fetch("/.netlify/functions/save-content", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-code": getCode() },
        body: JSON.stringify({ mpv: mpv })
      })
        .then(function (res) {
          if (!res.ok) return res.json().catch(function () { return {}; }).then(function (e) {
            throw new Error((e && e.error) || ("HTTP " + res.status));
          });
        })
        .then(function () {
          siteContent.mpv = mpv;
          msg.textContent = "Enregistre.";
          setTimeout(function () { msg.textContent = ""; }, 2500);
        })
        .catch(function (err) { msg.textContent = "Erreur: " + err.message; })
        .finally(function () { btn.disabled = false; });
    });
  }

  var photoState = {};
  var photoDirty = false;

  function prepareUpload(file) {
    if (file.type === "image/gif") {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () { resolve({ contentType: file.type, base64: reader.result.split(",")[1] }); };
        reader.onerror = function () { reject(new Error("lecture-echouee")); };
        reader.readAsDataURL(file);
      });
    }
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var maxDim = 1600;
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob(function (blob) {
          if (!blob) { reject(new Error("compression-echouee")); return; }
          var reader = new FileReader();
          reader.onload = function () { resolve({ contentType: "image/jpeg", base64: reader.result.split(",")[1] }); };
          reader.onerror = function () { reject(new Error("lecture-echouee")); };
          reader.readAsDataURL(blob);
        }, "image/jpeg", 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("image-invalide")); };
      img.src = url;
    });
  }

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function getPhotoState(item) {
    if (!photoState[item.id]) {
      photoState[item.id] = {
        x: item.pos && typeof item.pos.x === "number" ? item.pos.x : 50,
        y: item.pos && typeof item.pos.y === "number" ? item.pos.y : 50,
        zoom: typeof item.zoom === "number" ? item.zoom : 1
      };
    }
    return photoState[item.id];
  }

  function renderPhotosTab() {
    if (!siteContent) {
      photosTabEl.innerHTML = '<div class="empty">Chargement...</div>';
      loadSiteContent().then(renderPhotosTab).catch(function () {
        photosTabEl.innerHTML = '<div class="empty">Erreur de chargement.</div>';
      });
      return;
    }
    var gallery = siteContent.gallery || [];
    var gridHtml = gallery.map(function (item) {
      var src = item.type === "blob" ? "/.netlify/functions/photo?key=" + encodeURIComponent(item.key) : item.src;
      return (
        '<div class="photo-item">' +
          '<div class="photo-frame" data-id="' + escapeHtml(item.id) + '">' +
            '<img src="' + escapeHtml(src) + '" alt="Photo galerie" draggable="false" />' +
          "</div>" +
          '<button class="photo-remove" data-id="' + escapeHtml(item.id) + '" type="button" aria-label="Supprimer">&#10005;</button>' +
          '<input class="photo-zoom" type="range" min="1" max="2.5" step="0.05" data-id="' + escapeHtml(item.id) + '" />' +
        "</div>"
      );
    }).join("");

    photosTabEl.innerHTML =
      '<div class="photo-grid">' + gridHtml + "</div>" +
      (gallery.length ? '<div class="photo-hint">Glisse une photo pour la centrer, utilise le curseur pour zoomer. Double-clic pour reinitialiser.</div>' : "") +
      '<label class="upload-btn">+ Ajouter des photos<input type="file" id="photoInput" accept="image/*" multiple /></label>' +
      '<div class="save-bar" id="photoSaveBar" style="display:none">' +
        '<button class="save-btn" id="photoSaveBtn" type="button">Enregistrer le cadrage</button>' +
      "</div>" +
      '<div class="save-msg" id="photoMsg"></div>';

    function markPhotoDirty() {
      photoDirty = true;
      document.getElementById("photoSaveBar").style.display = "";
    }

    gallery.forEach(function (item) {
      var frame = photosTabEl.querySelector('.photo-frame[data-id="' + CSS.escape(item.id) + '"]');
      var zoomInput = photosTabEl.querySelector('.photo-zoom[data-id="' + CSS.escape(item.id) + '"]');
      var img = frame.querySelector("img");
      var state = getPhotoState(item);
      zoomInput.value = state.zoom;

      function apply() {
        img.style.objectPosition = state.x + "% " + state.y + "%";
        img.style.transform = "scale(" + state.zoom + ")";
        img.style.transformOrigin = state.x + "% " + state.y + "%";
      }
      apply();

      var dragging = false, startClientX = 0, startClientY = 0, startX = 50, startY = 50;

      frame.addEventListener("pointerdown", function (e) {
        dragging = true;
        frame.classList.add("dragging");
        frame.setPointerCapture(e.pointerId);
        startClientX = e.clientX;
        startClientY = e.clientY;
        startX = state.x;
        startY = state.y;
      });
      frame.addEventListener("pointermove", function (e) {
        if (!dragging) return;
        var rect = frame.getBoundingClientRect();
        var dx = ((e.clientX - startClientX) / rect.width) * 100;
        var dy = ((e.clientY - startClientY) / rect.height) * 100;
        state.x = clamp(startX - dx, 0, 100);
        state.y = clamp(startY - dy, 0, 100);
        apply();
        markPhotoDirty();
      });
      function endDrag() { dragging = false; frame.classList.remove("dragging"); }
      frame.addEventListener("pointerup", endDrag);
      frame.addEventListener("pointercancel", endDrag);
      frame.addEventListener("dblclick", function () {
        state.x = 50; state.y = 50; state.zoom = 1;
        zoomInput.value = 1;
        apply();
        markPhotoDirty();
      });

      zoomInput.addEventListener("input", function () {
        state.zoom = parseFloat(zoomInput.value);
        apply();
        markPhotoDirty();
      });
    });

    if (photoDirty) document.getElementById("photoSaveBar").style.display = "";

    var saveBtn = document.getElementById("photoSaveBtn");
    saveBtn.addEventListener("click", function () {
      var msg = document.getElementById("photoMsg");
      saveBtn.disabled = true;
      var newGallery = siteContent.gallery.map(function (item) {
        var state = getPhotoState(item);
        return Object.assign({}, item, { pos: { x: state.x, y: state.y }, zoom: state.zoom });
      });
      fetch("/.netlify/functions/update-gallery", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-code": getCode() },
        body: JSON.stringify({ gallery: newGallery })
      })
        .then(function (res) {
          if (!res.ok) return res.json().catch(function () { return {}; }).then(function (e) {
            throw new Error((e && e.error) || ("HTTP " + res.status));
          });
        })
        .then(function () {
          siteContent.gallery = newGallery;
          photoDirty = false;
          document.getElementById("photoSaveBar").style.display = "none";
          msg.textContent = "Enregistre.";
          setTimeout(function () { msg.textContent = ""; }, 2500);
        })
        .catch(function (err) { msg.textContent = "Erreur: " + err.message; })
        .finally(function () { saveBtn.disabled = false; });
    });

    photosTabEl.querySelectorAll(".photo-remove").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-id");
        if (!confirm("Supprimer cette photo ?")) return;
        fetch("/.netlify/functions/delete-photo", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-admin-code": getCode() },
          body: JSON.stringify({ id: id })
        })
          .then(function (res) { if (!res.ok) throw new Error("delete-failed"); })
          .then(function () {
            siteContent.gallery = siteContent.gallery.filter(function (g) { return g.id !== id; });
            delete photoState[id];
            renderPhotosTab();
          })
          .catch(function () { alert("Erreur lors de la suppression."); });
      });
    });

    var photoInput = document.getElementById("photoInput");
    photoInput.addEventListener("change", function () {
      var files = Array.prototype.slice.call(photoInput.files);
      if (!files.length) return;
      var msg = document.getElementById("photoMsg");

      var uploadNext = function (i) {
        if (i >= files.length) {
          renderPhotosTab();
          var doneMsg = document.getElementById("photoMsg");
          if (doneMsg) {
            doneMsg.textContent = "Photos ajoutees.";
            setTimeout(function () { doneMsg.textContent = ""; }, 2000);
          }
          return;
        }
        var file = files[i];
        msg.textContent = "Envoi " + (i + 1) + "/" + files.length + " (" + file.name + ")...";
        prepareUpload(file)
          .then(function (prepared) {
            return fetch("/.netlify/functions/upload-photo", {
              method: "POST",
              headers: { "Content-Type": "application/json", "x-admin-code": getCode() },
              body: JSON.stringify({ contentType: prepared.contentType, dataBase64: prepared.base64 })
            });
          })
          .then(function (res) {
            if (!res.ok) return res.json().then(function (e) { throw new Error(e.error || "upload-failed"); });
            return res.json();
          })
          .then(function (result) {
            siteContent.gallery.push(result.entry);
            uploadNext(i + 1);
          })
          .catch(function (err) {
            msg.textContent = "Erreur (" + file.name + "): " + err.message;
            uploadNext(i + 1);
          });
      };
      uploadNext(0);
    });
  }

  tabButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      tabButtons.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      activeTab = btn.getAttribute("data-tab");
      var titles = { demandes: "Demandes recues", clients: "Espace clients", contenu: "Contenu du site", photos: "Galerie photos" };
      pageTitle.textContent = titles[activeTab] || "";
      sectionsEl.classList.toggle("hidden", activeTab !== "demandes");
      clientsListEl.classList.toggle("hidden", activeTab !== "clients");
      contentTabEl.classList.toggle("hidden", activeTab !== "contenu");
      photosTabEl.classList.toggle("hidden", activeTab !== "photos");
      searchInput.style.display = (activeTab === "contenu" || activeTab === "photos") ? "none" : "";
      if (activeTab === "demandes" || activeTab === "clients") render();
      if (activeTab === "contenu") renderContentTab();
      if (activeTab === "photos") renderPhotosTab();
    });
  });

  function loadSubmissions(code) {
    statusLine.textContent = "Chargement...";
    var controller = new AbortController();
    var timeoutId = setTimeout(function () { controller.abort(); }, 12000);
    return fetch("/.netlify/functions/get-submissions", {
      headers: { "x-admin-code": code },
      signal: controller.signal
    })
      .then(function (res) {
        clearTimeout(timeoutId);
        if (res.status === 401) throw new Error("unauthorized");
        if (!res.ok) throw new Error("server-error");
        return res.json();
      })
      .then(function (data) {
        allSubmissions = data;
        statusLine.textContent = data.length + " demande(s) - maj " + new Date().toLocaleTimeString("fr-CA", { timeStyle: "short" });
        render();
      })
      .catch(function (err) {
        clearTimeout(timeoutId);
        if (err.name === "AbortError") throw new Error("timeout");
        throw err;
      });
  }

  function unlock(code) {
    gateError.textContent = "Connexion en cours...";
    unlockBtn.disabled = true;
    unlockBtn.textContent = "Connexion...";
    loadSubmissions(code)
      .then(function () {
        gateError.textContent = "";
        sessionStorage.setItem(STORAGE_KEY, code);
        gate.classList.add("hidden");
        adminApp.classList.remove("hidden");
      })
      .catch(function (err) {
        if (err.message === "unauthorized") {
          gateError.textContent = "Code incorrect.";
        } else if (err.message === "timeout") {
          gateError.textContent = "Ca prend trop de temps (reseau lent ou bloque). Reessaie.";
        } else {
          gateError.textContent = "Erreur serveur: " + err.message;
        }
      })
      .finally(function () {
        unlockBtn.disabled = false;
        unlockBtn.textContent = "Deverrouiller";
      });
  }

  document.getElementById("gateForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var code = codeInput.value.trim();
    if (!code) return;
    unlock(code);
  });

  refreshBtn.addEventListener("click", function () {
    var code = getCode();
    if (code) loadSubmissions(code);
  });

  lockBtn.addEventListener("click", function () {
    sessionStorage.removeItem(STORAGE_KEY);
    adminApp.classList.add("hidden");
    gate.classList.remove("hidden");
    codeInput.value = "";
    codeInput.focus();
    overlay.classList.remove("show");
  });

  searchInput.addEventListener("input", render);

  var savedCode = getCode();
  if (savedCode) {
    unlock(savedCode);
  }
})();
</script>
</body>
</html>
